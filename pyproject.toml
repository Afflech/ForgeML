[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeml"
version = "2.0.0"
description = "Automated local-to-Kaggle ML training pipeline"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12, <1.0",
    "pydantic>=2.0, <3.0",
    "pyyaml>=6.0, <7.0",
    "kaggle>=2.2.0, <3.0.0",
    "sqlmodel>=0.0.18, <0.1.0",
    "rich>=13.0, <16.0",
    "python-dotenv>=1.0, <2.0",
    "openai>=1.40.0, <3.0.0",
]

[project.scripts]
forge = "forgeml.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeml"]

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: marks tests that call Kaggle API (deselect with -m 'not integration')"]
